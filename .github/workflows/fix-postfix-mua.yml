name: Fix Postfix MUA warnings (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pouge-mail-deploy
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    environment: vps_mail
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install SSH helper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
      - name: Apply guarded Postfix macro fix
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -eu
          set +x
          : "${VPS_HOST:?Missing VPS_HOST}"
          : "${VPS_USER:?Missing VPS_USER}"
          : "${SSHPASS:?Missing VPS_PASSWORD}"
          sshpass -e ssh -T -p "${VPS_PORT:-22}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 "$VPS_USER@$VPS_HOST" 'bash -se' < scripts/fix-postfix-mua.sh
