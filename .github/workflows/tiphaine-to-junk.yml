name: Move Tiphaine suspected spam to Junk
on:
  workflow_dispatch:
    inputs:
      scan_limit:
        description: 'Max messages to review in Tiphaine inbox (up to 1000, oldest first)'
        type: choice
        required: true
        default: '1000'
        options: ['100', '500', '1000']
permissions:
  contents: read
jobs:
  scan:
    environment: vps_mail
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install SSH helper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y sshpass
      - name: Move Tiphaine messages scoring 8 or above to Junk
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
          SCAN_LIMIT: ${{ inputs.scan_limit }}
        run: |
          set -eu
          : "${VPS_HOST:?missing VPS_HOST}"
          : "${VPS_USER:?missing VPS_USER}"
          : "${SSHPASS:?missing VPS_PASSWORD}"
          sshpass -e ssh -T -p "${VPS_PORT:-22}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 "$VPS_USER@$VPS_HOST" "SCAN_LIMIT='$SCAN_LIMIT' bash -se" < scripts/tiphaine-to-junk.sh
